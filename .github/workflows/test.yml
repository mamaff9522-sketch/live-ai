name: test

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline tests (fake model)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y -qq ffmpeg fonts-tlwg-loma-otf > /dev/null && ffmpeg -version | head -1 && lsb_release -ds
      - name: ffmpeg filter check
        run: mkdir -p offline-report && bash scripts/ffmpeg_diag.sh offline-report/ffmpeg_diag.txt
      - name: Offline + studio tests
        run: |
          mkdir -p offline-report
          set -o pipefail
          timeout -s INT 900 python -X faulthandler -u -m unittest tests.test_offline tests.test_studio -v 2>&1 \
            | tee offline-report/unittest.log | grep -v '"level": "INFO"' 
      - name: Publish test log
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash scripts/publish_report.sh offline-report offline

  real-model:
    name: Real Qwen3.5-2B on 2 free CPU cores
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write             # to publish the test report to the ci-reports branch
    env:
      LIVEAI_DATA_DIR: ${{ github.workspace }}/data
      LIVEAI_PORT: "7860"
      LIVEAI_HOST: 127.0.0.1
      LIVEAI_THREADS: "2"          # same as a free 2-vCPU machine (Hugging Face Space CPU basic)
      LIVEAI_SIGNUPS_PER_HOUR: "100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Machine
        run: |
          nproc; free -m; df -h . | tail -1
          grep -m1 'model name' /proc/cpuinfo
          echo "CPU_KEY=$(grep -m1 'model name' /proc/cpuinfo | md5sum | cut -c1-8)" >> "$GITHUB_ENV"

      - name: llama.cpp release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/ggml-org/llama.cpp/releases/latest | jq -r .tag_name)
          echo "LLAMA_TAG=$TAG" >> "$GITHUB_ENV"; echo "llama.cpp $TAG"

      - name: Restore llama.cpp build
        id: llcache
        uses: actions/cache/restore@v4
        with:
          path: llama-bin
          key: llama-server-${{ env.LLAMA_TAG }}-${{ env.CPU_KEY }}

      - name: Build llama-server (CPU)
        if: steps.llcache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp llama.cpp
          cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_USE_PREBUILT_UI=OFF -DLLAMA_BUILD_UI=OFF
          cmake --build llama.cpp/build --target llama-server -j"$(nproc)"
          mkdir -p llama-bin && cp llama.cpp/build/bin/llama-server llama-bin/

      - name: Save llama.cpp build
        if: steps.llcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: llama-bin
          key: llama-server-${{ env.LLAMA_TAG }}-${{ env.CPU_KEY }}

      - name: whisper.cpp release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          WTAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/ggml-org/whisper.cpp/releases/latest | jq -r .tag_name)
          echo "WHISPER_TAG=$WTAG" >> "$GITHUB_ENV"; echo "whisper.cpp $WTAG"

      - name: Restore whisper.cpp build
        id: wcache
        uses: actions/cache/restore@v4
        with:
          path: whisper-bin
          key: whisper-cli-${{ env.WHISPER_TAG }}-${{ env.CPU_KEY }}

      - name: Build whisper-cli (CPU)
        if: steps.wcache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$WHISPER_TAG" https://github.com/ggml-org/whisper.cpp whisper.cpp
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF
          cmake --build whisper.cpp/build --target whisper-cli -j"$(nproc)"
          mkdir -p whisper-bin && cp whisper.cpp/build/bin/whisper-cli whisper-bin/

      - name: Save whisper.cpp build
        if: steps.wcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: whisper-bin
          key: whisper-cli-${{ env.WHISPER_TAG }}-${{ env.CPU_KEY }}

      - name: Find the model (trusted source + SHA-256)
        run: |
          python -m live_ai.modelsource | tee model_source.json
          echo "--- link given in the task (checked only, not used unless trusted):"
          curl -sS -o /dev/null -w "gguf/Qwen3.5-2B-GGUF -> HTTP %{http_code}\n" -I -L \
            https://huggingface.co/gguf/Qwen3.5-2B-GGUF/resolve/main/qwen3.5-2b-Q4_K_M.gguf || true

      - name: Restore model
        id: modelcache
        uses: actions/cache/restore@v4
        with:
          path: data/models
          key: model-${{ hashFiles('model_source.json') }}

      - name: Start Live AI (pinned to 2 CPU cores)
        run: |
          export LIVEAI_LLAMA_SERVER="$PWD/llama-bin/llama-server"
          export LIVEAI_WHISPER_BIN="$PWD/whisper-bin/whisper-cli" LIVEAI_WHISPER_MODEL=small
          sudo apt-get install -y -qq ffmpeg fonts-tlwg-loma-otf > /dev/null
          "$LIVEAI_LLAMA_SERVER" --version || true
          nohup taskset -c 0,1 python -m live_ai > liveai_stdout.log 2>&1 &
          echo $! > liveai.pid

      - name: Real-model tests
        run: python tests/real_model_test.py http://127.0.0.1:7860 reports

      - name: Studio with real Thai speech (whisper.cpp, FLEURS)
        if: always()
        timeout-minutes: 60
        run: python tests/real_studio_test.py http://127.0.0.1:7860 reports

      - name: RAM with small context sizes (low-RAM machines)
        if: always()
        run: |
          kill "$(cat liveai.pid)" 2>/dev/null; sleep 3
          python tests/lowram_profile.py "$PWD/llama-bin/llama-server" "$(ls data/models/*.gguf | head -1)" reports/lowram_profile.json || true

      - name: Save model
        if: always() && steps.modelcache.outputs.cache-hit != 'true' && hashFiles('data/models/*.gguf') != ''
        uses: actions/cache/save@v4
        with:
          path: data/models
          key: model-${{ hashFiles('model_source.json') }}

      - name: Report
        if: always()
        run: |
          cat reports/real_model_report.md >> "$GITHUB_STEP_SUMMARY" || echo "no report" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p reports/logs && cp -r data/logs/. reports/logs/ 2>/dev/null || true
          cp liveai_stdout.log model_source.json reports/ 2>/dev/null || true
          rm -rf reports/studio_work

      - name: Publish report to the ci-reports branch
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash scripts/publish_report.sh reports real-model

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-model-report
          path: reports/

  docker:
    name: Docker image (${{ matrix.arch }}) starts and answers
    needs: offline
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: llama.cpp release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/ggml-org/llama.cpp/releases/latest | jq -r .tag_name)
          echo "LLAMA_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Build image
        run: |
          mkdir -p dreport
          set -o pipefail
          docker build --progress=plain --build-arg LLAMA_TAG="$LLAMA_TAG" -t live-ai . 2>&1 | tee dreport/build.log | tail -40
      - name: Run on 2 CPUs and ask one Thai question
        run: |
          docker run -d --name liveai --cpus 2 -p 7860:7860 -e LIVEAI_THREADS=2 live-ai
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:7860/api/health > h.json 2>/dev/null; then cat h.json; echo; break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:7860/api/health
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:7860/api/register -H 'Content-Type: application/json' -d '{"name":"docker"}' | jq -r .token)
          curl -fsS -X POST http://127.0.0.1:7860/api/chat -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"message":"สวัสดีครับ แนะนำตัวสั้น ๆ","stream":false}' | tee reply.json
          jq -e '.reply | length > 5' reply.json
      - name: Container logs
        if: always()
        run: |
          mkdir -p dreport
          docker logs liveai > dreport/container.log 2>&1 || true
          tail -60 dreport/container.log
          cp h.json reply.json dreport/ 2>/dev/null || true
          docker stats --no-stream liveai > dreport/stats.txt 2>&1 || true; uname -m >> dreport/stats.txt; nproc >> dreport/stats.txt
          docker exec liveai sh -c 'cat /data/logs/llama_server.log' > dreport/llama_server.log 2>/dev/null || true

      - name: Publish report to the ci-reports branch
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash scripts/publish_report.sh dreport docker-${{ matrix.arch }}

      - name: Publish the tested image (ghcr.io)
        if: success() && github.ref == 'refs/heads/main'
        run: |
          IMG=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "${{ github.token }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag live-ai "$IMG:${{ matrix.arch }}" && docker push "$IMG:${{ matrix.arch }}"

  image:
    name: One image for both CPU types
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - run: |
          IMG=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "${{ github.token }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$IMG:latest" "$IMG:amd64" "$IMG:arm64"
          docker buildx imagetools inspect "$IMG:latest"

  install:
    name: One-command install on a fresh machine, used through the public link
    needs: image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run the installer exactly as a user would
        run: LIVEAI_HTTPS=0 bash scripts/install.sh 2>&1 | tee install.log
      - name: Use it through the public HTTPS link
        run: |
          mkdir -p ireport && cp install.log ireport/
          URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' install.log | head -1)
          echo "$URL" > ireport/url.txt
          for i in $(seq 1 30); do curl -fsS "$URL/api/health" -o ireport/health.json && break; sleep 5; done
          T=$(curl -fsS -X POST "$URL/api/register" -H 'Content-Type: application/json' -d '{"name":"install-check"}' | jq -r .token)
          s=$(date +%s.%N)
          curl -fsS -X POST "$URL/api/chat" -H "Authorization: Bearer $T" -H 'Content-Type: application/json' \
            -d '{"message":"ช่วยอธิบายสั้น ๆ ว่า CPU กับ RAM ต่างกันอย่างไร","stream":false}' | tee ireport/reply.json
          echo "seconds $(echo "$(date +%s.%N) - $s" | bc)" | tee ireport/time.txt
          curl -fsS -o /dev/null -w "studio page %{http_code}\n" "$URL/studio" | tee -a ireport/time.txt
          docker stats --no-stream live-ai | tee ireport/stats.txt
          jq -e '.reply | length > 20' ireport/reply.json
      - name: Publish
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: mkdir -p ireport && cp install.log ireport/ 2>/dev/null; bash scripts/publish_report.sh ireport install
