name: deploy to my VPS

# Installs Live AI on your own empty Linux VPS (e.g. a SUN-VPS machine) and tests it through its public link.
# Repository secrets needed:  VPS_HOST (IP address), VPS_PASSWORD (root password)   [optional: VPS_USER, default root]
# Safety: it first inspects the machine and STOPS without changing anything if the machine is already
# running other systems (other Docker containers, web servers, สามจั๊ง, LiveKit …) or is too small.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Install even if other programs are found (only if you are sure the machine is free)"
        type: boolean
        default: false
      test_only:
        description: "Only test the running Live AI (no install)"
        type: boolean
        default: false
      private:
        description: "Owner-only: close sign-up of new users (LIVEAI_OPEN_REGISTRATION=0)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      SSHPASS: ${{ secrets.VPS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Connect
        run: |
          [ -n "$VPS_HOST" ] && [ -n "$SSHPASS" ] || { echo "::error::Add the secrets VPS_HOST and VPS_PASSWORD first"; exit 1; }
          sudo apt-get install -y -qq sshpass > /dev/null
          echo 'ssh() { sshpass -e /usr/bin/ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=30 "$VPS_USER@$VPS_HOST" "$@"; }' > ssh.sh
          . ./ssh.sh
          ssh 'echo connected'

      - name: Inspect the machine (changes nothing)
        if: ${{ !inputs.test_only }}
        run: |
          . ./ssh.sh; mkdir -p vps
          ssh 'bash -s' > vps/inspect.txt <<'EOF'
          echo "== system"; uname -m; (. /etc/os-release; echo "$PRETTY_NAME")
          echo "== cpu"; nproc
          echo "== ram_mb"; free -m | awk '/Mem:/{print $2}'
          echo "== disk_free_gb"; df -BG --output=avail / | tail -1 | tr -dc 0-9; echo
          echo "== other_containers"; (docker ps --format '{{.Names}} {{.Image}}' 2>/dev/null | grep -v -E '^live-ai(-link|-https)? ' || true)
          OURS='sshd|systemd-resolve|cloudflared|docker-proxy'; docker ps --format '{{.Names}}' 2>/dev/null | grep -qx live-ai-https && OURS="$OURS|caddy"
          echo "== listening"; (ss -ltnpH 2>/dev/null | grep -v -E "\"($OURS)\"" | awk '{print $4, $6}' || true)
          echo "== known_systems"; ls -d /opt/three-junk /opt/*livekit* /etc/livekit* 2>/dev/null || true
          echo "== end"
          EOF
          # the repository is public: only the size summary is shown or kept, never the list of programs
          mv vps/inspect.txt inspect.full
          awk '/^== (system|cpu|ram_mb|disk_free_gb)$/{f=1;print;next} /^== /{f=0} f' inspect.full | tee vps/machine.txt
          sec() { awk -v s="== $1" '$0==s{f=1;next} /^== /{f=0} f' inspect.full; }
          RAM=$(sec ram_mb); DISK=$(sec disk_free_gb); OTHER=$(sec other_containers; sec listening; sec known_systems)
          echo "RAM=${RAM}MB DISK=${DISK}GB"
          if [ "${RAM:-0}" -lt 3300 ]; then echo "::error::RAM ${RAM} MB is too small (need 4 GB or more)"; exit 1; fi
          if [ "${DISK:-0}" -lt 12 ]; then echo "::error::Only ${DISK} GB free disk (need 12 GB or more)"; exit 1; fi
          if [ -n "$(echo "$OTHER" | tr -d '[:space:]')" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "::error::This machine already runs $(echo "$OTHER" | grep -c .) other programs/services - stopped without changing anything"; exit 1
          fi

      - name: Install (one command, same as scripts/install.sh)
        if: ${{ !inputs.test_only }}
        run: |
          . ./ssh.sh
          ssh 'cat > /tmp/live-ai-install.sh' < scripts/install.sh
          set -o pipefail
          REG=$([ "${{ inputs.private }}" = "false" ] && echo 1 || echo 0)
          timeout 2400 bash -c ". ./ssh.sh; ssh 'LIVEAI_OPEN_REGISTRATION=$REG bash /tmp/live-ai-install.sh' < /dev/null" 2>&1 | tee vps/install.log || echo "installer did not finish by itself - checking the machine"
          set +o pipefail
          URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' vps/install.log | head -1)
          [ -n "$URL" ] || URL=$(ssh 'docker logs live-ai-link 2>&1' < /dev/null | grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' | tail -1)
          echo "$URL" > vps/url.txt
          cat vps/url.txt

      - name: Test through the public link (Thai chat, memory, isolation, studio page)
        shell: bash
        run: |
          set -u; mkdir -p vps; . ./ssh.sh
          [ -s vps/url.txt ] || ssh 'docker logs live-ai-link 2>&1' < /dev/null | grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' | tail -1 > vps/url.txt
          # the permanent address (Caddy + sslip.io) is preferred; the trycloudflare link is the fallback
          D=$(ssh "docker inspect -f '{{join .Args \" \"}}' live-ai-https 2>/dev/null" < /dev/null | sed -n 's/.*--from \([^ ]*\).*/\1/p')
          if [ -n "$D" ] && curl -fsS -m 20 "https://$D/api/health" >/dev/null; then echo "https://$D" > vps/stable.txt; else echo "::warning::permanent https address not reachable from outside (ports 80/443?)"; : > vps/stable.txt; fi
          URL=$(cat vps/stable.txt); [ -n "$URL" ] || URL=$(cat vps/url.txt)
          [ -n "$URL" ] || { echo "::error::no public link"; exit 1; }
          echo "testing through $URL"
          echo "$URL"
          for i in $(seq 1 30); do curl -fsS "$URL/api/health" -o vps/health.json && break; sleep 5; done
          cat vps/health.json; echo
          # every request records its HTTP status, so a failure shows exactly what the server answered
          call() { local out=$1; shift; local code; code=$(curl -sS -o "vps/$out" -w "%{http_code}" "$@"); echo "$out HTTP $code: $(head -c 400 "vps/$out")"; echo "$out $code" >> vps/status.txt; }
          # test users are created with the admin key, so the test also works when sign-up is closed
          AK=$(ssh 'cat ~/.live-ai-admin-key 2>/dev/null' < /dev/null); [ -n "$AK" ] && echo "::add-mask::$AK"
          call reg_closed.json -X POST "$URL/api/register" -H 'Content-Type: application/json' -d '{"name":"คนนอก"}'
          echo "::notice::model=$(jq -r 'if (.model|type)=="object" then .model.model else .model end // empty' vps/health.json) signup_without_key=$(tail -1 vps/status.txt)"
          call reg_a.json -X POST "$URL/api/register" -H 'Content-Type: application/json' -H "X-Admin-Key: $AK" -d '{"name":"ทดสอบ A"}'
          call reg_b.json -X POST "$URL/api/register" -H 'Content-Type: application/json' -H "X-Admin-Key: $AK" -d '{"name":"ทดสอบ B"}'
          A=$(jq -r .token vps/reg_a.json); B=$(jq -r .token vps/reg_b.json)
          ask() { call "$1" -X POST "$URL/api/chat" -H "Authorization: Bearer $2" -H 'Content-Type: application/json' -d "{\"message\":\"$3\",\"stream\":false}"; }
          s=$(date +%s.%N); ask hello.json "$A" "สวัสดีครับ แนะนำตัวสั้น ๆ"
          echo "hello_seconds $(echo "$(date +%s.%N) - $s" | bc)" | tee vps/timing.txt
          ask remember.json "$A" "จำไว้ว่า สีโปรดของฉันคือสีเขียว"
          ask recall.json "$A" "สีโปรดของฉันคือสีอะไร"
          ask other_user.json "$B" "สีโปรดของฉันคือสีอะไร"
          s=$(date +%s.%N); ask code.json "$A" "เขียนฟังก์ชัน Python หาค่าเฉลี่ยของลิสต์ตัวเลข สั้น ๆ"
          echo "code_seconds $(echo "$(date +%s.%N) - $s" | bc)" | tee -a vps/timing.txt
          curl -sS -o /dev/null -w "studio_page %{http_code}\n" "$URL/studio" | tee -a vps/timing.txt
          curl -sS -o /dev/null -w "growth_page %{http_code}\n" "$URL/growth" | tee -a vps/timing.txt
          curl -sS -o /dev/null -w "privacy_page %{http_code}\n" "$URL/privacy" | tee -a vps/timing.txt
          call growth.json "$URL/api/growth" -H "Authorization: Bearer $A"
          ssh 'docker stats --no-stream live-ai; free -m' < /dev/null | tee vps/resources.txt
          ok=1
          jq -e '.reply | length > 5' vps/hello.json >/dev/null || { echo "::error::hello failed"; ok=0; }
          jq -e '.reply | contains("เขียว")' vps/recall.json >/dev/null || { echo "::error::memory recall failed"; ok=0; }
          # the other user must not be told user A's colour (the model may still list green among suggestions)
          jq -e '(.reply | type == "string") and (.reply | test("(สีโปรด|ชอบ)[^\\n]{0,25}(คือ|เป็น)?[^\\n]{0,6}สีเขียว") | not)' vps/other_user.json >/dev/null || { echo "::error::second user check failed"; ok=0; }
          jq -e '.reply | contains("def ")' vps/code.json >/dev/null || { echo "::error::code answer failed"; ok=0; }
          grep -q "studio_page 200" vps/timing.txt || { echo "::error::studio page failed"; ok=0; }
          grep -q "growth_page 200" vps/timing.txt || { echo "::error::growth page failed"; ok=0; }
          jq -e '.connected == false' vps/growth.json >/dev/null || { echo "::error::growth API failed"; ok=0; }
          [ $ok = 1 ] && echo "ALL CHECKS PASSED" | tee vps/result.txt || { echo "SOME CHECKS FAILED" | tee vps/result.txt; exit 1; }

      - name: Publish result to the ci-reports branch
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: mkdir -p vps && bash scripts/publish_report.sh vps vps
