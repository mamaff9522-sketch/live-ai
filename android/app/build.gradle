plugins { id "com.android.application" }

// The server address is given at build time:  gradle assembleRelease -PserverUrl=https://...
def serverUrl = project.findProperty("serverUrl") ?: "https://example.invalid"
def ks = System.getenv("LIVEAI_KEYSTORE")

android {
    namespace "ai.live.app"
    compileSdk 35
    defaultConfig {
        minSdk 26
        targetSdk 35
        versionCode((project.findProperty("versionCode") ?: "1") as int)
        versionName project.findProperty("versionName") ?: "1.0"
        buildConfigField "String", "SERVER_URL", "\"${serverUrl}\""
    }
    buildFeatures { buildConfig true }
    // Two apps from the same code: "Live AI" opens the chat, "Live AI ตัดต่อ" opens the editing studio.
    // They install side by side (different application ids) and share the server and the signing key.
    flavorDimensions "app"
    productFlavors {
        chat {
            dimension "app"
            applicationId "ai.live.app"
            buildConfigField "String", "START_PATH", "\"\""
            resValue "string", "app_name", "Live AI"
        }
        studio {
            dimension "app"
            applicationId "ai.live.studio"
            buildConfigField "String", "START_PATH", "\"/studio\""
            resValue "string", "app_name", "Live AI ตัดต่อ"
        }
    }
    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("LIVEAI_KEYSTORE_PASSWORD")
                keyAlias "liveai"
                keyPassword System.getenv("LIVEAI_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
