<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f1;--panel:#fff;--ink:#1d1f1e;--muted:#6b6f6c;--line:#e3e1da;--accent:#0f7b5f;--accent-ink:#fff;--me:#e7f2ee;--code:#1f2421;--code-ink:#e8efe9;--warn:#a5481b}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121514;--panel:#1a1e1c;--ink:#e6e9e7;--muted:#9aa29d;--line:#2a302d;--accent:#3bb38d;--accent-ink:#0b1310;--me:#1d2b26;--code:#0c0f0e;--code-ink:#dfe8e2;--warn:#e08a5c}}
:root[data-theme=dark]{--bg:#121514;--panel:#1a1e1c;--ink:#e6e9e7;--muted:#9aa29d;--line:#2a302d;--accent:#3bb38d;--accent-ink:#0b1310;--me:#1d2b26;--code:#0c0f0e;--code-ink:#dfe8e2;--warn:#e08a5c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans Thai",system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
.app{display:flex;flex-direction:column;height:100dvh;max-width:820px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:18px;margin:0;font-weight:600;flex:1}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:6px}
.dot.ok{background:var(--accent)}.dot.bad{background:var(--warn)}
.status{font-size:13px;color:var(--muted);white-space:nowrap}
.icon{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;cursor:pointer}
main{flex:1;overflow-y:auto;padding:16px}
.msg{margin:0 0 14px;padding:10px 14px;border-radius:12px;max-width:100%;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.user{background:var(--me);margin-left:15%}
.msg.assistant{background:var(--panel);border:1px solid var(--line)}
.msg.error{color:var(--warn);border:1px solid var(--warn);background:transparent}
.msg pre{background:var(--code);color:var(--code-ink);padding:10px 12px;border-radius:8px;overflow-x:auto;white-space:pre;font:13px/1.5 "IBM Plex Mono",monospace;margin:8px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px}.chip{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--panel)}.chip button{border:0;background:transparent;color:var(--muted);cursor:pointer}
.thinking{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:8px;margin-bottom:6px;white-space:pre-wrap;max-height:9em;overflow:auto}
.stats{font-size:12px;color:var(--muted);margin-top:6px}
.empty{color:var(--muted);text-align:center;margin-top:20vh}
form.composer{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel);align-items:flex-end}
textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg);max-height:40vh;min-height:44px}
.send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
.send:disabled{opacity:.5}
label.think{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap;padding-bottom:10px}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:5}
.drawer.open{display:block}
.drawer .sheet{position:absolute;left:0;top:0;bottom:0;width:min(340px,88vw);background:var(--panel);padding:16px;overflow-y:auto;border-right:1px solid var(--line)}
.sheet h2{font-size:15px;margin:18px 0 8px;color:var(--muted);font-weight:500}
.row{display:flex;gap:6px;align-items:center;padding:8px;border-radius:8px;cursor:pointer}
.row:hover,.row.active{background:var(--me)}
.row span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row button{border:0;background:transparent;color:var(--muted);cursor:pointer}
.login{max-width:420px;margin:12vh auto;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.login input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin:6px 0 12px}
.login p{color:var(--muted);font-size:14px}
.token{font:13px "IBM Plex Mono",monospace;word-break:break-all;background:var(--bg);padding:8px;border-radius:8px}
.icon.mic.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.voicebar{display:none;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);background:var(--me);font-size:15px}
.voicebar.on{display:flex}.voicebar span{flex:1}
.voicebar button{border:0;border-radius:10px;padding:8px 14px;background:var(--warn);color:#fff;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div id="root"></div>
<script>
const $ = (t, a = {}, ...kids) => { const e = document.createElement(t); for (const [k, v] of Object.entries(a)) { if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'class') e.className = v; else e.setAttribute(k, v); } for (const c of kids.flat()) if (c != null) e.append(c); return e; };
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v) } catch {} } };
let token = store.get('liveai_token'), conv = null, busy = false;

async function api(path, opt = {}) {
  const r = await fetch(path, { ...opt, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(opt.headers || {}) } });
  if (r.status === 401) { store.set('liveai_token', null); token = null; renderLogin(); throw new Error('ต้องเข้าสู่ระบบใหม่'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

// Render text with ``` code fences; everything else as plain text (never HTML).
function rich(text) {
  const out = []; const parts = text.split(/```/);
  parts.forEach((p, i) => {
    if (i % 2) { const nl = p.indexOf('\n'); out.push($('pre', {}, nl >= 0 ? p.slice(nl + 1) : p)); return; }
    p.split(/(\[\[video:[a-f0-9]{24}\]\])/).forEach(q => {
      const m = q.match(/^\[\[video:([a-f0-9]{24})\]\]$/);
      if (m) out.push(videoEl(m[1])); else if (q) out.push(document.createTextNode(q));
    });
  });
  return out;
}
function videoEl(id) {
  const v = $('video', { controls: true, playsinline: true, preload: 'metadata', style: 'width:100%;max-height:60vh;border-radius:8px;background:#000;margin-top:6px' });
  const a = $('a', { style: 'display:block;margin-top:4px;font-size:13px' }, '⬇ ดาวน์โหลด MP4');
  api(`/api/media/${id}/url`).then(j => { v.src = j.url; a.href = j.url + '&download=1'; }).catch(() => { a.textContent = '(ไฟล์หมดอายุแล้ว)'; });
  return $('div', {}, v, a);
}

function renderLogin(created) {
  const root = document.getElementById('root'); root.replaceChildren();
  const name = $('input', { placeholder: 'ชื่อที่ใช้แสดง', maxlength: 60 });
  const tok = $('input', { placeholder: 'หรือวางรหัสเข้าใช้เดิม (lai_...)' });
  const msg = $('p');
  root.append($('div', { class: 'login' },
    $('h1', {}, 'Live AI'),
    $('p', {}, 'ผู้ช่วยภาษาไทยที่รันบน CPU ประวัติแชตและความจำของแต่ละคนแยกจากกัน'),
    name,
    $('button', { class: 'send', onclick: async () => {
      try { const j = await api('/api/register', { method: 'POST', body: JSON.stringify({ name: name.value }) }); token = j.token; store.set('liveai_token', token);
        msg.replaceChildren('เก็บรหัสนี้ไว้ ใช้เข้าจากเครื่องอื่นได้ (ระบบไม่เก็บรหัสจริงไว้ จึงกู้คืนให้ไม่ได้):', $('div', { class: 'token' }, token), $('button', { class: 'send', style: 'margin-top:10px', onclick: renderApp }, 'เริ่มใช้งาน'));
      } catch (e) { msg.textContent = e.message; } } }, 'สร้างบัญชีใหม่'),
    $('hr', { style: 'border:0;border-top:1px solid var(--line);margin:18px 0' }),
    tok,
    $('button', { class: 'icon', onclick: async () => { token = tok.value.trim(); try { await api('/api/me'); store.set('liveai_token', token); renderApp(); } catch (e) { msg.textContent = 'รหัสไม่ถูกต้อง'; } } }, 'เข้าด้วยรหัสเดิม'),
    msg));
}

let els = {};
function renderApp() {
  const root = document.getElementById('root'); root.replaceChildren();
  els.status = $('span', { class: 'status' }, $('span', { class: 'dot' }), 'กำลังตรวจ…');
  els.main = $('main');
  els.input = $('textarea', { rows: 1, placeholder: 'พิมพ์ข้อความ… (เช่น จำไว้ว่า ฉันชอบกาแฟ)', onkeydown: e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } }, oninput: e => { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; } });
  els.think = $('input', { type: 'checkbox' });
  els.send = $('button', { class: 'send', type: 'submit' }, 'ส่ง');
  els.file = $('input', { type: 'file', multiple: true, accept: 'video/*,audio/*,image/*', style: 'display:none', onchange: e => attach([...e.target.files]) });
  els.clip = $('button', { class: 'icon', type: 'button', title: 'แนบวิดีโอ/เสียง/ภาพ เพื่อให้ตัดต่อ', onclick: () => els.file.click() }, '📎');
  els.chips = $('div', { class: 'chips' });
  els.mic = Voice.can ? $('button', { class: 'icon mic', type: 'button', title: 'คุยด้วยเสียง', 'aria-label': 'คุยด้วยเสียง', onclick: voiceToggle }, '🎤') : null;
  els.voiceText = $('span', {}, '');
  els.voice = $('div', { class: 'voicebar' }, els.voiceText, $('button', { type: 'button', onclick: voiceStop }, 'หยุดคุย'));
  els.drawer = $('div', { class: 'drawer', onclick: e => { if (e.target === els.drawer) els.drawer.classList.remove('open'); } }, els.sheet = $('div', { class: 'sheet' }));
  root.append($('div', { class: 'app' },
    $('header', {}, $('button', { class: 'icon', 'aria-label': 'เมนู', onclick: openDrawer }, '☰'), $('h1', {}, 'Live AI'), els.status, $('button', { class: 'icon', onclick: () => openConv(null) }, '＋ แชตใหม่')),
    els.main,
    els.chips,
    els.voice,
    $('form', { class: 'composer', onsubmit: e => { e.preventDefault(); send(); } }, els.clip, els.file, els.mic, els.input, $('label', { class: 'think', title: 'ให้คิดก่อนตอบ ช้ากว่าแต่ละเอียดกว่า' }, els.think, 'คิดละเอียด'), els.send)), els.drawer);
  openConv(conv); pollHealth();
}

async function openDrawer() {
  els.drawer.classList.add('open'); els.sheet.replaceChildren($('p', {}, 'กำลังโหลด…'));
  const [convs, mems] = await Promise.all([api('/api/conversations'), api('/api/memories')]);
  els.sheet.replaceChildren(
    $('h2', {}, 'บทสนทนา'),
    convs.length ? convs.map(c => $('div', { class: 'row' + (c.id === conv ? ' active' : ''), onclick: () => { els.drawer.classList.remove('open'); openConv(c.id); } }, $('span', {}, c.title || 'แชต'),
      $('button', { title: 'ลบ', onclick: async e => { e.stopPropagation(); if (confirm('ลบบทสนทนานี้?')) { await api('/api/conversations/' + c.id, { method: 'DELETE' }); if (conv === c.id) openConv(null); openDrawer(); } } }, '✕'))) : $('p', { class: 'status' }, 'ยังไม่มี'),
    $('h2', {}, 'สิ่งที่ Live AI จำเกี่ยวกับคุณ'),
    mems.length ? mems.map(m => $('div', { class: 'row' }, $('span', {}, m.content), $('button', { title: 'ลืม', onclick: async () => { await api('/api/memories/' + m.id, { method: 'DELETE' }); openDrawer(); } }, '✕'))) : $('p', { class: 'status' }, 'พิมพ์ "จำไว้ว่า ..." เพื่อให้จำ'),
    $('h2', {}, 'เครื่องมือ'),
    $('a', { class: 'icon', href: '/studio', style: 'display:inline-block;text-decoration:none' }, '🎬 สตูดิโอตัดต่อวิดีโอ'), ' ',
    $('a', { class: 'icon', href: '/growth', style: 'display:inline-block;text-decoration:none;margin-top:6px' }, '📈 เพิ่มผู้ติดตามเพจ'),
    $('h2', {}, 'บัญชี'),
    $('button', { class: 'icon', onclick: () => { if (confirm('ออกจากระบบ? ต้องใช้รหัสเข้าใช้เพื่อกลับเข้ามา')) { store.set('liveai_token', null); token = null; renderLogin(); } } }, 'ออกจากระบบ'));
}

async function openConv(id) {
  conv = id; els.main.replaceChildren();
  if (!id) { els.main.append($('div', { class: 'empty' }, 'เริ่มคุยได้เลย ถามความรู้ ให้วิเคราะห์ ให้เขียนโค้ด หรือวางแผนงาน')); return; }
  for (const m of await api(`/api/conversations/${id}/messages`)) els.main.append($('div', { class: 'msg ' + m.role }, rich(m.content)));
  els.main.scrollTop = els.main.scrollHeight;
}

let attached = [], lastEdit = null;
async function attach(files) {
  for (const f of files) {
    const chip = $('span', { class: 'chip' }, `⏳ ${f.name}`); els.chips.append(chip);
    try {
      const m = await new Promise((ok, bad) => { const x = new XMLHttpRequest(); x.open('POST', '/api/media'); x.setRequestHeader('Authorization', 'Bearer ' + token);
        x.setRequestHeader('Content-Type', f.type || 'video/mp4'); x.setRequestHeader('X-Filename', encodeURIComponent(f.name));
        x.upload.onprogress = e => e.lengthComputable && (chip.textContent = `⏳ ${f.name} ${Math.round(100 * e.loaded / e.total)}%`);
        x.onload = () => { let j = {}; try { j = JSON.parse(x.responseText) } catch {} x.status < 300 ? ok(j) : bad(new Error(j.error || x.statusText)); }; x.onerror = () => bad(new Error('อัปโหลดไม่สำเร็จ')); x.send(f); });
      attached.push(m); chip.replaceChildren(`${attached.length}. ${m.name}`, $('button', { type: 'button', onclick: () => { attached = attached.filter(x => x !== m); chip.remove(); } }, '✕'));
    } catch (e) { chip.textContent = `❌ ${f.name}: ${e.message}`; setTimeout(() => chip.remove(), 5000); }
  }
  els.input.placeholder = 'บอกวิธีตัดต่อ เช่น ต่อคลิป 1-2 ทำแนวตั้ง';
}
async function sendEdit(text) {
  const box = $('div', { class: 'msg assistant' }, 'กำลังวางแผนตัดต่อ…'); els.main.append(box);
  const body = attached.length ? { instruction: text, media_ids: attached.map(m => m.id), conversation_id: conv } : { instruction: text, base_edit: lastEdit };
  let e = await api('/api/edits', { method: 'POST', body: JSON.stringify(body) });
  conv = e.conversation_id; attached = []; els.chips.replaceChildren();
  while (!['done', 'failed'].includes(e.status)) {
    await new Promise(r => setTimeout(r, 1500)); e = await api('/api/edits/' + e.id);
    box.replaceChildren(e.status === 'planning' ? 'Qwen กำลังวางแผนตัดต่อ…' : `กำลังตัดต่อ ${Math.round(100 * e.progress)}%`, e.summary ? $('div', { class: 'stats', style: 'white-space:pre-wrap' }, e.summary) : '');
  }
  if (e.status === 'failed') { box.className = 'msg error'; box.textContent = 'ตัดต่อไม่สำเร็จ: ' + (e.error || ''); return; }
  lastEdit = e.id;
  box.replaceChildren(`ตัดต่อเสร็จแล้ว (${e.output.duration.toFixed(1)} วินาที)`, $('div', { class: 'stats', style: 'white-space:pre-wrap' }, e.summary), videoEl(e.output.id),
    $('div', { class: 'stats' }, 'พิมพ์คำสั่งเพิ่มเพื่อแก้ต่อได้ เช่น "ตัดให้สั้นลง" หรือ "เปลี่ยนเป็นแนวนอน" (เริ่มคำสั่งด้วย แก้:)'));
}

async function send(voice = false) {
  const text = els.input.value.trim(); if (!text || busy) return '';
  if (attached.length || (lastEdit && /^แก้\s*[:：]/.test(text))) {
    busy = true; els.send.disabled = true; els.input.value = '';
    els.main.querySelector('.empty')?.remove(); els.main.append($('div', { class: 'msg user' }, '🎬 ' + text));
    try { await sendEdit(text.replace(/^แก้\s*[:：]\s*/, '')); } catch (e) { els.main.append($('div', { class: 'msg error' }, e.message)); }
    busy = false; els.send.disabled = false; els.main.scrollTop = els.main.scrollHeight; return;
  }
  busy = true; els.send.disabled = true; els.input.value = ''; els.input.style.height = 'auto';
  els.main.querySelector('.empty')?.remove();
  els.main.append($('div', { class: 'msg user' }, text));
  const box = $('div', { class: 'msg assistant' }, '…'); els.main.append(box); els.main.scrollTop = els.main.scrollHeight;
  let answer = '', thinking = '', thinkEl = null;
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify({ message: text, conversation_id: conv, think: els.think.checked, voice }) });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || r.statusText); }
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true }); let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
        if (!line.startsWith('data:')) continue;
        const ev = JSON.parse(line.slice(5));
        if (ev.type === 'meta') conv = ev.conversation_id;
        else if (ev.type === 'recovering') box.textContent = 'โมเดลหยุดทำงาน กำลังกู้คืนอัตโนมัติ…';
        else if (ev.type === 'queue') box.textContent = `รอคิว (มีก่อนหน้า ${ev.position} ข้อความ)…`;
        else if (ev.type === 'thinking') { thinking += ev.text; thinkEl = thinkEl || $('div', { class: 'thinking' }); thinkEl.textContent = thinking; box.replaceChildren(thinkEl, ...rich(answer)); }
        else if (ev.type === 'token') { answer += ev.text; box.replaceChildren(...(thinkEl ? [thinkEl] : []), ...rich(answer)); }
        else if (ev.type === 'error') { box.className = 'msg error'; box.textContent = ev.message; }
        else if (ev.type === 'done') { const s = ev.stats; box.append($('div', { class: 'stats' }, `${s.seconds} วินาที · ${s.tokens_per_second} โทเคน/วินาที${s.memory === 'remembered' ? ' · จำไว้แล้ว' : ''}`)); }
        els.main.scrollTop = els.main.scrollHeight;
      }
    }
  } catch (e) { box.className = 'msg error'; box.textContent = e.message; answer = ''; }
  busy = false; els.send.disabled = false; if (!voice) els.input.focus();
  return box.classList.contains('error') ? '' : answer;
}

// Voice conversation ----------------------------------------------------------
// In the Android app the phone's own speech recognizer and Thai voice are used (window.LiveAIVoice);
// in Chrome the browser's Web Speech API. Either way only the text goes to Live AI.
const Voice = (() => {
  const B = window.LiveAIVoice, SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let cb = {}, rec = null;
  window.__liveaiVoice = (ev, text) => { const f = cb[ev]; if (f) f(text || ''); };
  const listen = () => new Promise((ok, bad) => {
    if (B) { cb = { result: ok, error: e => bad(new Error(e)) }; B.listen(); return; }
    const r = rec = new SR(); let got = false;
    r.lang = 'th-TH'; r.interimResults = false; r.maxAlternatives = 1;
    r.onresult = e => { got = true; ok(e.results[0][0].transcript); };
    r.onerror = e => { got = true; bad(new Error(e.error)); };
    r.onend = () => { if (!got) bad(new Error('no-speech')); };
    r.start();
  });
  const speak = text => new Promise(ok => {
    if (!text) return ok();
    if (B) { cb = { spoken: ok, error: e => { if (/tts-th-missing/.test(e)) alert('มือถือยังไม่มีเสียงพูดภาษาไทย: ไปที่ การตั้งค่า > การเข้าถึง/ภาษา > เอาต์พุตการอ่านออกเสียง แล้วดาวน์โหลดภาษาไทย'); ok(); } }; B.speak(text); return; }
    const u = new SpeechSynthesisUtterance(text); u.lang = 'th-TH';
    const v = speechSynthesis.getVoices().find(x => /^th/i.test(x.lang)); if (v) u.voice = v;
    u.onend = ok; u.onerror = ok; speechSynthesis.cancel(); speechSynthesis.speak(u);
  });
  const stop = () => { cb = {}; if (B) B.stop(); else { try { rec && rec.abort(); } catch {} try { speechSynthesis.cancel(); } catch {} } };
  return { can: !!(B || (SR && window.speechSynthesis)), listen, speak, stop };
})();

function spoken(t) {
  return t.replace(/```[\s\S]*?(```|$)/g, ' (โค้ดอยู่บนหน้าจอ) ').replace(/\[\[video:[a-f0-9]{24}\]\]/g, '')
          .replace(/[*#_`>|~]/g, '').replace(/\s+/g, ' ').trim();
}
let voiceOn = false;
function voiceSay(t) { els.voiceText.textContent = t; }
function voiceStop() {
  voiceOn = false; Voice.stop(); els.voice.classList.remove('on'); els.mic && els.mic.classList.remove('on');
}
async function voiceToggle() {
  if (voiceOn) return voiceStop();
  voiceOn = true; els.voice.classList.add('on'); els.mic.classList.add('on');
  let misses = 0;
  while (voiceOn) {
    voiceSay('🎤 กำลังฟัง… พูดได้เลย');
    let text = '';
    try { text = (await Voice.listen()).trim(); }
    catch (e) {
      if (!voiceOn) break;
      if (/permission|not-allowed/.test(e.message)) { voiceSay('ต้องอนุญาตให้ใช้ไมโครโฟนก่อน'); voiceOn = false; break; }
      if (/unavailable|service-not-allowed/.test(e.message)) { voiceSay('มือถือเครื่องนี้ไม่มีระบบแปลงเสียงพูดเป็นข้อความ'); voiceOn = false; break; }
    }
    if (!voiceOn) break;
    if (!text) { if (++misses < 2) continue; voiceSay('ไม่ได้ยินเสียง แตะ 🎤 เพื่อคุยต่อ'); voiceOn = false; break; }
    misses = 0; els.input.value = text; voiceSay('💭 กำลังคิด…');
    const answer = await send(true);
    if (!voiceOn) break;
    if (answer) { voiceSay('🔊 กำลังตอบ… (แตะ หยุดคุย เพื่อหยุด)'); await Voice.speak(spoken(answer)); }
  }
  // a message explaining why voice stopped stays visible for a few seconds; otherwise the bar closes
  els.mic && els.mic.classList.remove('on');
  const why = !/^[🎤💭🔊]/u.test(els.voiceText.textContent);
  setTimeout(() => { if (!voiceOn) els.voice.classList.remove('on'); }, why ? 5000 : 0);
}

async function pollHealth() {
  try { const r = await fetch('/api/health'); const h = await r.json();
    const st = { ready: ['ok', 'พร้อม'], loading: ['', 'กำลังโหลดโมเดล'], starting: ['', 'กำลังเริ่ม'], restarting: ['bad', 'กำลังกู้คืน'], failed: ['bad', 'โมเดลขัดข้อง'] }[h.model.state] || ['', h.model.state];
    els.status.replaceChildren($('span', { class: 'dot ' + st[0] }), st[1]);
  } catch { els.status.replaceChildren($('span', { class: 'dot bad' }), 'ออฟไลน์'); }
  setTimeout(pollHealth, 10000);
}

token ? renderApp() : renderLogin();
</script>
